<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competitor watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFE8;--ink:#1C2B25;--muted:#5E6B63;--rule:#C9D0C4;--mark:#F4D83B;--err:#A63A24;--panel:#F7F8F4}
@media (prefers-color-scheme:dark){:root{--bg:#161D19;--ink:#E6EBE3;--muted:#9AA79E;--rule:#33403A;--mark:#C9AE1C;--err:#E08A74;--panel:#1D2621}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px;display:grid;grid-template-columns:230px 1fr;gap:40px}
@media (max-width:760px){.wrap{grid-template-columns:1fr;gap:24px}}
h1{font-size:2rem;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;max-width:56ch}
aside h2{font-size:1rem;margin:6px 0 10px}
aside ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
aside li{border-bottom:1px solid var(--rule)}
aside button.site{all:unset;display:block;width:100%;padding:10px 2px;cursor:pointer}
aside button.site:hover b{text-decoration:underline}
aside small{display:block;color:var(--muted)}
form.main{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
input.domain{flex:1 1 260px}
button.go{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:10px 20px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
details{margin:14px 0 0;color:var(--muted)}
details summary{cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.opts label{display:grid;gap:4px;font-size:.875rem}
.status{margin:28px 0 12px;padding:12px 14px;border-left:4px solid var(--ink);background:var(--panel)}
.status.err{border-color:var(--err)}
.status b{display:block}
.status p{margin:4px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:.875rem}
.chips span{border:1px solid var(--rule);border-radius:99px;padding:2px 10px}
.chips .bad{border-color:var(--err);color:var(--err)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.875rem;border-bottom:1px solid var(--ink);padding:6px 8px}
td{padding:12px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td a{color:inherit;font-weight:500}
td .d{display:block;color:var(--muted);font-size:.875rem;max-width:60ch}
tr.new .t{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px}
.num{text-align:right;white-space:nowrap}
.price{margin:12px 0;padding:12px 14px;border:1px solid var(--rule)}
.price code{display:block;font:inherit;font-size:.875rem}
.reset{all:unset;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block}
.empty{color:var(--muted)}
@media (max-width:620px){th.h,td.h{display:none}}
</style>
</head>
<body>
<div class="wrap">
<aside>
  <h2>Watching</h2>
  <ul id="sites"><li class="empty" style="padding:10px 2px">Nothing yet. Check a domain to start.</li></ul>
</aside>
<main>
  <h1>Competitor watch</h1>
  <p class="sub">Enter a competitor's domain. We read their blog and pricing page, remember what we saw, and flag only what's new on the next check.</p>
  <form class="main" id="f">
    <input class="domain" id="domain" placeholder="competitor.com" aria-label="Competitor domain" autocomplete="off" required>
    <button class="go" id="go">Check now</button>
  </form>
  <details>
    <summary>Alerts and keyword API</summary>
    <div class="opts">
      <label>Slack webhook URL<input id="slack" placeholder="https://hooks.slack.com/services/..."></label>
      <label>Email address<input id="email" type="email" placeholder="you@company.com"></label>
      <label>Keyword API<select id="prov"><option value="auto">Server default</option><option value="keywordseverywhere">Keywords Everywhere</option><option value="dataforseo">DataForSEO</option></select></label>
      <label>API key<input id="key" type="password" placeholder="key, or login:password for DataForSEO"></label>
    </div>
  </details>
  <div id="out" aria-live="polite"></div>
</main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const apiMsg = {no_api_key:"No keyword API key. Volumes unavailable.",invalid_api_key:"Keyword API key was rejected.",quota_exceeded:"Keyword API quota used up.",rate_limited:"Keyword API rate limited.",timeout:"Keyword API timed out.",api_error:"Keyword API error.",skipped:""};

function vol(p){
  if (p.volume != null) return p.volume.toLocaleString();
  return "n/a";
}
function rowsHtml(posts, newUrls){
  if (!posts.length) return '<p class="empty">No posts stored yet.</p>';
  return `<table><thead><tr><th>Post</th><th class="h">Target keyword</th><th class="num">Searches/mo</th><th class="num h">Published</th></tr></thead><tbody>` +
    posts.map(p => `<tr class="${newUrls.has(p.url) ? "new" : ""}"><td><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a><span class="d">${esc(p.description)}</span></td>
    <td class="h">${esc(p.keyword)}</td><td class="num">${vol(p)}</td><td class="num h">${esc(p.published || "")}</td></tr>`).join("") + "</tbody></table>";
}
function chips(r){
  const c = [];
  const a = r.alerts || {};
  for (const [k,v] of Object.entries(a)) c.push(`<span class="${v.startsWith("failed")?"bad":""}">${k}: ${esc(v)}</span>`);
  const ka = r.keyword_api;
  if (ka && ka.status !== "skipped") c.push(`<span class="${ka.status==="ok"?"":"bad"}">keywords: ${esc(ka.status==="ok"?ka.provider:(ka.message||apiMsg[ka.status]))}</span>`);
  return c.length ? `<div class="chips">${c.join("")}</div>` : "";
}
function priceHtml(p){
  if (!p) return "";
  if (p.first_snapshot) return `<div class="price">Pricing page saved as the baseline. We'll flag any change.</div>`;
  return `<div class="price"><b>Pricing changed</b> on ${esc(p.url)}${p.added.map(l=>`<code>+ ${esc(l)}</code>`).join("")}${p.removed.map(l=>`<code>− ${esc(l)}</code>`).join("")}</div>`;
}
function render(r){
  if (!r.ok){
    $("out").innerHTML = `<div class="status err"><b>${esc({blocked:"The site blocked us",no_blog:"No blog found",unreachable:"Couldn't reach the site",blocked_by_robots:"Crawling not allowed",invalid:"Check the domain",busy:"Already running",rate_limited:"Slow down"}[r.status] || "Check failed")}</b><p>${esc(r.message)}</p></div>`;
    return;
  }
  const n = r.new_count, shown = new Set(r.new_posts.map(p => p.url));
  const head = r.first_run ? `Now tracking ${esc(r.domain)}` : n ? `${n} new post${n>1?"s":""} on ${esc(r.domain)}` : `No new posts on ${esc(r.domain)}`;
  const sub = r.first_run ? `${n} posts indexed. Showing the ${r.new_posts.length} most recent. Run it again later and only new posts are flagged.` : `Compared with the check on ${esc((r.previous_check||"").slice(0,10))}. ${r.found_total} posts found in total.`;
  $("out").innerHTML = `<div class="status"><b>${head}</b><p>${sub}</p>${(r.notes||[]).map(x=>`<p>${esc(x)}</p>`).join("")}</div>` +
    chips(r) + priceHtml(r.pricing) + (r.new_posts.length ? rowsHtml(r.new_posts, shown) : "") +
    `<button class="reset" onclick="reset('${esc(r.domain)}')">Forget ${esc(r.domain)} and start over</button>`;
}
async function loadSites(){
  const s = await (await fetch("/api/sites")).json();
  $("sites").innerHTML = s.length ? s.map(x => `<li><button class="site" data-d="${esc(x.domain)}"><b>${esc(x.domain)}</b><small>${x.post_count} posts · ${esc((x.last_checked||"").slice(0,10))}</small></button></li>`).join("") : '<li class="empty" style="padding:10px 2px">Nothing yet. Check a domain to start.</li>';
}
$("sites").addEventListener("click", async e => {
  const b = e.target.closest("button.site"); if (!b) return;
  const d = await (await fetch("/api/sites/" + encodeURIComponent(b.dataset.d))).json();
  $("domain").value = b.dataset.d;
  $("out").innerHTML = `<div class="status"><b>${esc(b.dataset.d)}</b><p>Stored posts, newest first.</p></div>` + rowsHtml(d.posts, new Set()) +
    `<button class="reset" onclick="reset('${esc(b.dataset.d)}')">Forget ${esc(b.dataset.d)} and start over</button>`;
});
async function reset(d){ if(!confirm("Delete everything stored for "+d+"?")) return; await fetch("/api/sites/"+encodeURIComponent(d),{method:"DELETE"}); $("out").innerHTML=""; loadSites(); }
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true; $("go").textContent = "Checking…";
  $("out").innerHTML = '<div class="status"><b>Reading the site</b><p>Sitemap, feeds, blog pages and pricing. This can take up to a minute.</p></div>';
  try {
    const res = await fetch("/api/check", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
      domain:$("domain").value, slack_webhook:$("slack").value, email:$("email").value, kw_provider:$("prov").value, kw_key:$("key").value})});
    render(await res.json());
  } catch { render({ok:false,status:"error",message:"The server didn't respond. Try again."}); }
  $("go").disabled = false; $("go").textContent = "Check now"; loadSites();
});
loadSites();
</script>
</body>
</html>
